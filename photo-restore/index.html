<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>老照片修复 · 昝阿鹏的主页</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ====== 顶部导航 ====== -->
  <nav class="nav">
    <div class="container nav-inner">
      <a class="logo" href="../index.html">🪐 昝阿鹏的主页</a>
      <div class="nav-links">
        <a href="../index.html">返回主页</a>
      </div>
    </div>
  </nav>

  <!-- ====== 页面标题 ====== -->
  <header class="page-head">
    <h1>🖼️ 老照片修复</h1>
    <p class="subtitle">上传老照片，一键去黄、去噪、锐化、调色 —— 所有处理都在你的浏览器本地完成，图片不会上传到任何服务器。</p>
  </header>

  <main class="container">
    <!-- 上传区 -->
    <div id="dropzone" class="dropzone">
      <div class="dz-icon">📷</div>
      <p class="dz-title">点击选择，或把照片拖拽到这里</p>
      <p class="dz-hint">支持 JPG / PNG / WebP · 长边超过 2000px 会自动缩放以加快处理</p>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>

    <!-- 编辑区（上传后显示） -->
    <div id="workspace" class="workspace hidden">
      <div class="stage-wrap">
        <div class="stage">
          <canvas id="stage" width="0" height="0"></canvas>
          <div id="busy" class="busy hidden">处理中…</div>
        </div>
      </div>

      <aside class="panel">
        <div class="btn-row">
          <button id="autoBtn" class="btn primary">✨ 自动修复</button>
          <button id="resetBtn" class="btn">↺ 重置</button>
        </div>

        <div class="control">
          <label>去黄 / 色温 <span id="temperatureVal" class="val">0</span></label>
          <input type="range" id="temperature" min="-100" max="100" value="0" />
        </div>
        <div class="control">
          <label>亮度 <span id="brightnessVal" class="val">0</span></label>
          <input type="range" id="brightness" min="-100" max="100" value="0" />
        </div>
        <div class="control">
          <label>对比度 <span id="contrastVal" class="val">0</span></label>
          <input type="range" id="contrast" min="-100" max="100" value="0" />
        </div>
        <div class="control">
          <label>饱和度 <span id="saturationVal" class="val">0</span></label>
          <input type="range" id="saturation" min="-100" max="100" value="0" />
        </div>
        <div class="control">
          <label>去噪 <span id="denoiseVal" class="val">0</span></label>
          <input type="range" id="denoise" min="0" max="100" value="0" />
        </div>
        <div class="control">
          <label>锐化 <span id="sharpenVal" class="val">0</span></label>
          <input type="range" id="sharpen" min="0" max="100" value="0" />
        </div>

        <div class="btn-row">
          <button id="changeBtn" class="btn ghost">🖼 换一张照片</button>
          <button id="compareBtn" class="btn ghost">👁 按住看原图</button>
        </div>
        <button id="downloadBtn" class="btn primary wide">⬇ 下载修复结果（PNG）</button>

        <p class="note">提示：先点「自动修复」找感觉，再用滑杆微调；多张照片之间可以切换对比效果。</p>
      </aside>
    </div>
  </main>

  <!-- ====== 底部 ====== -->
  <footer class="footer">
    <div class="container">
      <p class="copyright">© <span id="year"></span> 昝阿鹏 · 本地处理 · 图片不上传</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
